name: blob-layout-parity

# Asserts the Rust and .NET blob storage implementations against two
# canonical contracts:
#   docs/BLOB_STORAGE_LAYOUT.md                  (contract: file/S3 layout,
#                                                 delegate protocol v1)
#   docs/BLOB_LAYOUT_CONVERGENCE_PLAN.md         (rationale/history)
#   docs/BLOB_HTTP_SURFACE.md                    (contract: GET/HEAD/PUT
#                                                 /blobs/{hash} origin, S2.1b)
#   engine/commands/blob-layout-vectors.v1.json  (path/key/name/delegate
#                                                 vectors, source of truth)
#   engine/commands/blob-http-surface-vectors.v1.json (HTTP origin vectors,
#                                                 source of truth)
#   engine/commands/fixtures/blob-layout-v1/     (golden cross-runtime
#                                                 fixture tree)
#   engine/commands/zstd-interop-vectors.v1.json (cross-runtime zstd fixture
#                                                 manifest, slice 0.1 of
#                                                 blob-cas-remediation.md)
#   engine/commands/fixtures/zstd-interop-v1/    (golden cross-runtime zstd
#                                                 frame fixtures)
#   server/server/tests/blob_layout_vectors.rs
#   server/server/tests/blob_layout_interop.rs
#   server/server/tests/blob_http_surface.rs
#   server/server/tests/zstd_interop.rs          (rust-as-consumer only; the
#                                                 dotnet-as-consumer RED test
#                                                 is skip-gated until 3.1 and
#                                                 intentionally has no step
#                                                 below)
#   server/server/tests/tree_walk_depth.rs       (slice 1.5 / finding #9 — a
#                                                 deep single-entry tree-blob
#                                                 chain must fail closed with
#                                                 TreeWalkError::TooDeep rather
#                                                 than overflowing the worker
#                                                 stack and aborting the
#                                                 process. NOTE: tree_walk.rs
#                                                 itself was absent from the
#                                                 paths: filters below until
#                                                 1.5 — a step alone does not
#                                                 make a suite run; the trigger
#                                                 must list the source file the
#                                                 suite guards, or the workflow
#                                                 never fires on the PR that
#                                                 breaks it)
#   server/s3-blobs/src/lib.rs (blob_layout_vectors_match_s3_key_derivation)
#   server/server/tests/blob_relay_nonhydrating_backend.rs (S4.2 relay
#                                                 contract; previously shipped
#                                                 without a CI step — added
#                                                 alongside slice 0.2 of
#                                                 blob-cas-remediation.md
#                                                 while its fake was promoted
#                                                 to nodalmerge-blobstore-conformance)
#   server/server/tests/blob_nonhydrating_conformance.rs (slice 0.2's
#                                                 non-hydrating-backend
#                                                 conformance harness — GC
#                                                 live-set / tree-walk /
#                                                 archive-export scenarios
#                                                 against S3BlobStore's real
#                                                 shape; the RED scenarios
#                                                 that gate Phase 2 are
#                                                 `#[ignore]`d and skipped by
#                                                 this step until their slice
#                                                 ships)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs (see
#                                                 note above — no dotnet CI
#                                                 step yet)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NonHydratingBlobBackendConformanceTests.cs
#                                                 (slice 0.2's .NET half —
#                                                 both tests are RED/Skip-gated
#                                                 until slice 2.1, so this file
#                                                 intentionally has no dotnet
#                                                 CI step yet either)

on:
  push:
    branches: [main]
    paths:
      - "engine/commands/blob-layout-vectors.v1.json"
      - "engine/commands/blob-http-surface-vectors.v1.json"
      - "engine/commands/fixtures/blob-layout-v1/**"
      - "engine/commands/zstd-interop-vectors.v1.json"
      - "engine/commands/fixtures/zstd-interop-v1/**"
      - "server/server/src/store.rs"
      - "server/server/src/room.rs"
      - "server/server/src/tree_walk.rs"
      - "server/server/src/blob_http.rs"
      - "server/server/src/main.rs"
      - "server/dev-server/src/main.rs"
      - "server/axum-embed/src/lib.rs"
      - "server/server/tests/blob_layout_vectors.rs"
      - "server/server/tests/blob_layout_interop.rs"
      - "server/server/tests/blob_gc.rs"
      - "server/server/tests/tree_walk_depth.rs"
      - "server/server/tests/blob_http_surface.rs"
      - "server/server/tests/zstd_interop.rs"
      - "server/server/tests/blob_relay_nonhydrating_backend.rs"
      - "server/server/tests/blob_nonhydrating_conformance.rs"
      - "server/stores/blob-conformance/**"
      - "server/s3-blobs/src/lib.rs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobGcCoordinator.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobUrlResolverProvider.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobGcCoordinatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderMigrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs"
      - ".github/workflows/blob-layout-parity.yml"
  pull_request:
    paths:
      - "engine/commands/blob-layout-vectors.v1.json"
      - "engine/commands/blob-http-surface-vectors.v1.json"
      - "engine/commands/fixtures/blob-layout-v1/**"
      - "engine/commands/zstd-interop-vectors.v1.json"
      - "engine/commands/fixtures/zstd-interop-v1/**"
      - "server/server/src/store.rs"
      - "server/server/src/room.rs"
      - "server/server/src/tree_walk.rs"
      - "server/server/src/blob_http.rs"
      - "server/server/src/main.rs"
      - "server/dev-server/src/main.rs"
      - "server/axum-embed/src/lib.rs"
      - "server/server/tests/blob_layout_vectors.rs"
      - "server/server/tests/blob_layout_interop.rs"
      - "server/server/tests/blob_gc.rs"
      - "server/server/tests/tree_walk_depth.rs"
      - "server/server/tests/blob_http_surface.rs"
      - "server/server/tests/zstd_interop.rs"
      - "server/server/tests/blob_relay_nonhydrating_backend.rs"
      - "server/server/tests/blob_nonhydrating_conformance.rs"
      - "server/stores/blob-conformance/**"
      - "server/s3-blobs/src/lib.rs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobGcCoordinator.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobUrlResolverProvider.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobGcCoordinatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderMigrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs"
      - ".github/workflows/blob-layout-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  rust-blob-layout:
    name: rust blob layout + S3 key + interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run file-store unit tests (layout, migration, GC)
        run: "cargo test -p nodalmerge-server --lib store::"

      - name: Run blob GC integration tests
        run: cargo test -p nodalmerge-server --test blob_gc

      - name: Run blob layout vectors
        run: cargo test -p nodalmerge-server --test blob_layout_vectors

      - name: Run cross-runtime golden fixture interop test
        run: cargo test -p nodalmerge-server --test blob_layout_interop

      - name: Run non-hydrating-backend relay contract (S4.2)
        run: cargo test -p nodalmerge-server --test blob_relay_nonhydrating_backend

      - name: Run non-hydrating-backend conformance harness (slice 0.2; RED scenarios are #[ignore]d until their Phase 2 slice ships)
        run: cargo test -p nodalmerge-server --test blob_nonhydrating_conformance

      - name: Run tree-walk depth-bound regression test (slice 1.5, finding #9 — deep chain must fail closed, not abort the process)
        run: cargo test -p nodalmerge-server --test tree_walk_depth

      - name: Run cross-runtime zstd interop test (dotnet-produced frame)
        run: cargo test -p nodalmerge-server --test zstd_interop

      - name: Run blob HTTP surface vectors (GET/HEAD/PUT /blobs/{hash})
        run: cargo test -p nodalmerge-server --test blob_http_surface

      - name: Run S3 key layout vectors
        run: cargo test -p nodalmerge-s3-blobs --lib

  dotnet-blob-layout:
    name: dotnet blob layout + delegate protocol + interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run blob layout + delegate protocol vectors
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobLayoutParityTests"

      - name: Run cross-runtime golden fixture interop test
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobLayoutInteropTests"

      - name: Run blob HTTP surface vectors (GET/HEAD/PUT /blobs/{hash})
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobHttpSurfaceTests"

      - name: Run file GC coordinator tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobGcCoordinatorTests"

      - name: Run file store migration tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobStoreProviderMigrationTests"
