[package]
name = "nodalmerge-s3-blobs"
version = "0.2.0"
edition = "2021"
description = "S3-compatible BlobPersistence backend for nodalmerge-server (AWS, R2, MinIO, GCS, Azure)."

[dependencies]
nodalmerge-core = { version = "0.2.0", path = "../../core/crdt" }
nodalmerge-gc = { version = "0.2.0", path = "../../core/gc" }
nodalmerge-server = { version = "0.2.0", path = "../server" }
object_store = { version = "0.11", features = ["aws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tracing = "0.1"
thiserror = { workspace = true }
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true }
# blob-cas-remediation.md slice 1.3 — `minio_round_trip.rs`'s
# `s3_min_physical_grace_floor_is_effective_end_to_end` drives the real
# `Rooms::sweep_blobs` → `Composite` → `S3BlobStore` path (the production
# wiring `server-s3` builds), which needs a server signing key.
ed25519-dalek = { workspace = true }
testcontainers = { version = "0.23", features = ["blocking"] }
tempfile = "3"
tracing-subscriber = "0.3"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
