[package]
name = "nodalmerge-host-axum"
version = "0.1.0"
edition = "2021"
description = "Paper-thin Axum adapter for embedding NodalMerge host runtime"
readme = "README.md"
keywords = ["crdt", "sync", "axum", "host"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
nodalmerge-server = { version = "0.1.0", path = "../server" }
axum = { version = "0.7", features = ["ws"] }
ed25519-dalek = { workspace = true }
tower-http = { version = "0.5", features = ["cors"] }
