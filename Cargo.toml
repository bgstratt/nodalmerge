[workspace]
members = [
    "core",
    "wrappers/nodalmerge-core",
    "gc",
    "wrappers/nodalmerge-gc",
    "host-core",
    "wrappers/nodalmerge-host-core",
    "host-axum",
    "wrappers/nodalmerge-host-axum",
    "host-ffi",
    "wrappers/nodalmerge-host-ffi",
    "server",
    "wrappers/nodalmerge-server",
    "bridge",
    "jwt-bridge",
    "wrappers/nodalmerge-jwt-bridge",
    "s3-blobs",
    "wrappers/nodalmerge-s3-blobs",
    "node-stores/mongo",
    "wrappers/nodalmerge-mongo-store",
    "dev-server",
    "node-stores/postgres",
    "wrappers/nodalmerge-postgres-store",
    "node-stores/conformance",
    "wrappers/nodalmerge-nodestore-conformance",
]
resolver = "2"

[workspace.dependencies]
aes-gcm = "0.10"
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports"] }
ed25519-dalek = { version = "2", features = ["rand_core", "batch"] }
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

# Bench builds keep full optimization but emit debuginfo so flamegraph/blondie
# can resolve symbols. No effect on `cargo build --release` artifacts.
[profile.bench]
debug = "line-tables-only"
