[package]
name = "nodalmerge-bridge"
version = "0.2.0"
edition = "2021"
description = "WASM bridge: exposes nodalmerge-core to JavaScript"
readme = "README.md"
keywords = ["crdt", "sync", "wasm", "javascript"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nodalmerge-core = { version = "0.2.0", path = "../../core/crdt" }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
