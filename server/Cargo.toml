[package]
name = "activesync-server"
version = "0.1.0"
edition = "2021"
description = "ActiveSync reflector server: authenticates peers and broadcasts state packs"

[[bin]]
name = "activesync-server"
path = "src/main.rs"

[dependencies]
activesync-core = { version = "0.1.0", path = "../core" }
activesync-gc = { version = "0.1.0", path = "../gc" }
activesync-host-core = { version = "0.1.0", path = "../host-core" }
ed25519-dalek = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }
governor = "0.7"

[dev-dependencies]
tokio-tungstenite = "0.24"
base64 = "0.22"
