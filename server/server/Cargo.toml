[package]
name = "nodalmerge-server"
version = "0.2.0"
edition = "2021"
autobins = false
description = "NodalMerge reflector server: authenticates peers and broadcasts state packs"

[[bin]]
name = "nodalmerge-server"
path = "src/nodalmerge_server_main.rs"

[dependencies]
nodalmerge-core = { version = "0.2.0", path = "../../core/crdt" }
nodalmerge-gc = { version = "0.2.0", path = "../../core/gc" }
nodalmerge-host-core = { version = "0.2.0", path = "../../engine/host-core" }
nodalmerge-capability-profile = { version = "0.2.0", path = "../capability-profile" }
ed25519-dalek = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }
governor = "0.7"
zstd = "0.13"

[dev-dependencies]
tokio-tungstenite = "0.24"
base64 = "0.22"
nodalmerge-command-registry = { version = "0.2.0", path = "../../engine/commands" }
tower = { version = "0.5", features = ["util"] }
# S4.2: MinIO-gated blob-URL-resolution integration test
# (tests/blob_url_resolution_minio.rs). A dev-dependency on
# nodalmerge-s3-blobs is not a cyclic *package* dependency (Cargo only
# resolves dev-dependencies for this crate's own test/example/bench
# targets, never for its library build) even though nodalmerge-s3-blobs
# itself depends on nodalmerge-server normally.
nodalmerge-s3-blobs = { version = "0.2.0", path = "../s3-blobs" }
testcontainers = { version = "0.23", features = ["blocking"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
