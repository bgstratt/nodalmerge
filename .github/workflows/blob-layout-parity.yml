name: blob-layout-parity

# Asserts the Rust and .NET blob storage implementations against two
# canonical contracts:
#   docs/BLOB_STORAGE_LAYOUT.md                  (contract: file/S3 layout,
#                                                 delegate protocol v1)
#   docs/BLOB_LAYOUT_CONVERGENCE_PLAN.md         (rationale/history)
#   docs/BLOB_HTTP_SURFACE.md                    (contract: GET/HEAD/PUT
#                                                 /blobs/{hash} origin, S2.1b)
#   engine/commands/blob-layout-vectors.v1.json  (path/key/name/delegate
#                                                 vectors, source of truth)
#   engine/commands/blob-http-surface-vectors.v1.json (HTTP origin vectors,
#                                                 source of truth)
#   engine/commands/fixtures/blob-layout-v1/     (golden cross-runtime
#                                                 fixture tree)
#   engine/commands/zstd-interop-vectors.v1.json (cross-runtime zstd fixture
#                                                 manifest, slice 0.1 of
#                                                 blob-cas-remediation.md)
#   engine/commands/fixtures/zstd-interop-v1/    (golden cross-runtime zstd
#                                                 frame fixtures)
#   server/server/tests/blob_layout_vectors.rs
#   server/server/tests/blob_layout_interop.rs
#   server/server/tests/blob_http_surface.rs
#   server/server/tests/zstd_interop.rs           (rust-as-consumer only: Rust
#                                                 decoding a .NET-produced
#                                                 frame was already green
#                                                 pre-3.1, since Rust's
#                                                 decode_all handles both
#                                                 content-size-header shapes.
#                                                 The other, previously-broken
#                                                 direction — .NET decoding a
#                                                 *Rust*-produced frame — is
#                                                 pinned by ZstdInteropTests.cs
#                                                 below, not here)
#   server/server/tests/tree_walk_depth.rs       (slice 1.5 / finding #9 — a
#                                                 deep single-entry tree-blob
#                                                 chain must fail closed with
#                                                 TreeWalkError::TooDeep rather
#                                                 than overflowing the worker
#                                                 stack and aborting the
#                                                 process. NOTE: tree_walk.rs
#                                                 itself was absent from the
#                                                 paths: filters below until
#                                                 1.5 — a step alone does not
#                                                 make a suite run; the trigger
#                                                 must list the source file the
#                                                 suite guards, or the workflow
#                                                 never fires on the PR that
#                                                 breaks it)
#   server/s3-blobs/src/lib.rs (blob_layout_vectors_match_s3_key_derivation)
#   server/server/tests/blob_relay_nonhydrating_backend.rs (S4.2 relay
#                                                 contract; previously shipped
#                                                 without a CI step — added
#                                                 alongside slice 0.2 of
#                                                 blob-cas-remediation.md
#                                                 while its fake was promoted
#                                                 to nodalmerge-blobstore-conformance)
#   server/server/tests/blob_nonhydrating_conformance.rs (slice 0.2's
#                                                 non-hydrating-backend
#                                                 conformance harness — GC
#                                                 live-set / tree-walk /
#                                                 archive-export scenarios
#                                                 against S3BlobStore's real
#                                                 shape; the RED scenarios
#                                                 that gate Phase 2 are
#                                                 `#[ignore]`d and skipped by
#                                                 this step until their slice
#                                                 ships)
#   hosts/dotnet/…/BlobCompression.cs             (slice 3.1's fix — see the
#                                                 ZstdInteropTests.cs entry
#                                                 below. Was missing from the
#                                                 paths: filters until the CI
#                                                 follow-up for 3.1: the file
#                                                 that was actually fixed
#                                                 could not trigger this
#                                                 workflow)
#   hosts/dotnet/…/ServiceCollectionExtensions.cs (the DI composition root —
#                                                 every .NET test below reaches
#                                                 File/S3Delegated provider
#                                                 wiring through
#                                                 AddNodalMergeHostProviders.
#                                                 Added by the 3.1 CI
#                                                 follow-up audit: a wiring
#                                                 regression here (e.g. which
#                                                 provider "File" resolves to)
#                                                 could break every test below
#                                                 with no trigger)
#   hosts/dotnet/…/NodalMergeHostProviderOptions.cs (parses which provider
#                                                 each test's config selects;
#                                                 same audit, same reasoning)
#   hosts/dotnet/…/FileBlobStorageOptions.cs      (binds Compression/
#                                                 CompressionLevel/
#                                                 CompressionMinBytes — the
#                                                 config surface that decides
#                                                 whether BlobCompression is
#                                                 even invoked; same audit)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs (slice
#                                                 3.1, finding #4 — pins the
#                                                 direction that was actually
#                                                 broken: .NET decoding a
#                                                 header-less zstd frame
#                                                 produced by Rust's
#                                                 zstd::stream::encode_all.
#                                                 BlobCompression.TryDecompress
#                                                 used to require
#                                                 written == buffer.Length
#                                                 after sizing the output
#                                                 buffer from
#                                                 Decompressor.GetDecompressedSize,
#                                                 which returns only an upper
#                                                 bound (the zstd default
#                                                 window size) for frames
#                                                 without a content-size
#                                                 header — every frame Rust's
#                                                 at-rest encoder produces — so
#                                                 every cross-runtime
#                                                 compressed fetch was
#                                                 rejected as "corrupt zstd
#                                                 frame." Fixed by accepting
#                                                 written <= buffer.Length.
#                                                 A Rust-only interop test
#                                                 (zstd_interop.rs above)
#                                                 cannot catch a regression
#                                                 here: it only proves Rust
#                                                 can still read a .NET frame,
#                                                 never that .NET can read a
#                                                 Rust one — hence this
#                                                 dedicated dotnet CI step,
#                                                 added alongside the CI
#                                                 follow-up for slice 3.1)
#   hosts/dotnet/src/NodalMerge.Host.Abstractions/Providers/IBlobStoreProvider.cs
#                                                 (slice 2.1's new ExistsAsync
#                                                 default member)
#   hosts/dotnet/src/NodalMerge.Host.Composition/HttpRemoteBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.Host.Composition/ChainedBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.DotNetHost/WebApplicationExtensions.cs   (HEAD +
#                                                 PUT-idempotency call sites
#                                                 slice 2.1 routes through
#                                                 ExistsAsync instead of a full
#                                                 TryGetBlobAsync read)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NonHydratingBlobBackendConformanceTests.cs
#                                                 (slice 0.2's .NET half — both
#                                                 tests were RED/Skip-gated
#                                                 until slice 2.1 un-gated them;
#                                                 now green and run below)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobStoreProviderExistsAsyncDefaultTests.cs
#                                                 (slice 2.1's ⚠ compat pin: a
#                                                 provider implementing ONLY
#                                                 the two original
#                                                 IBlobStoreProvider members
#                                                 still compiles and still
#                                                 answers ExistsAsync correctly
#                                                 via the default)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderExistsAsyncTests.cs
#                                                 (slice 2.1 — FileBlobStoreProvider's
#                                                 cheap File.Exists override)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpEncodingNegotiationTests.cs
#                                                 (slice 2.1 changed
#                                                 Head_ignores_accept_encoding_and_behaves_as_before's
#                                                 expectation: HEAD no longer
#                                                 sets Content-Length, matching
#                                                 the Rust reference and the
#                                                 frozen head-found vector.
#                                                 This file previously ran in
#                                                 NO workflow at all — added
#                                                 below alongside the fix that
#                                                 depends on it)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/HttpRemoteBlobStoreProviderTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobStoreProviderTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ChainedBlobStoreProviderTests.cs
#                                                 (these three previously ran
#                                                 in NO workflow either — slice
#                                                 2.1 added ExistsAsync
#                                                 overrides/composition to all
#                                                 three providers, so their
#                                                 suites are wired in below.
#                                                 RemoteBlobLinkAggregatorTests.cs
#                                                 joined them: the aggregator IS
#                                                 the single "remote" the chain
#                                                 sees once >1 remote link is
#                                                 configured, so it needed its
#                                                 own ExistsAsync override or
#                                                 2.1's benefit silently
#                                                 vanished for the three-link
#                                                 deployment.
#                                                 Sibling files this same audit
#                                                 found equally uncovered —
#                                                 ChainedBlobStoreProviderHttpIntegrationTests.cs,
#                                                 S3DirectChainCompositionTests.cs,
#                                                 ProviderS3DelegatedBlobResolverIntegrationTests.cs
#                                                 — are NOT touched by slice
#                                                 2.1's production changes and
#                                                 are left for the broader CI
#                                                 follow-up, now tracked as
#                                                 Phase 8 (deferred) in
#                                                 blob-cas-remediation.md)

