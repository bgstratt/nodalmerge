[package]
name = "nodalmerge-postgres-store"
version = "0.2.0"
edition = "2021"
publish = false
description = "PostgreSQL NodePersistence adapter for NodalMerge (F7)"

[dependencies]
nodalmerge-core   = { path = "../../../core/crdt" }
nodalmerge-server = { path = "../../server" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate"] }
tokio = { workspace = true }
serde = { workspace = true }
tracing = "0.1"
metrics = "0.23"
thiserror = { workspace = true }
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true }
testcontainers = { version = "0.23", features = ["blocking"] }
tracing-subscriber = "0.3"
nodalmerge-nodestore-conformance = { path = "../conformance" }
nodalmerge-core = { path = "../../../core/crdt" }
