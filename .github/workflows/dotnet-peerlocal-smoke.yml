name: dotnet-peerlocal-smoke

on:
  push:
    branches: [main]
    paths:
      - "hosts/dotnet/**"
      - "peer/runtime-local-ffi/**"
      - "core/**"
      - "peer/runtime-local/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dotnet-peerlocal-smoke.yml"
  pull_request:
    paths:
      - "hosts/dotnet/**"
      - "peer/runtime-local-ffi/**"
      - "core/**"
      - "peer/runtime-local/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dotnet-peerlocal-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-peerlocal:
    name: .NET peer-local FFI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build peer-local FFI (release)
        run: cargo build -p nodalmerge-runtime-local-ffi --release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test LocalPersistFfi + peer-local service
        env:
          NODALMERGE_LOCAL_FFI_DLL: ${{ github.workspace }}/target/release/libnodalmerge_runtime_local_ffi.so
        run: |
          dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj \
            --filter "FullyQualifiedName~LocalPersistFfi|FullyQualifiedName~RuntimePeerLocal"

      # Slice 6.5 (nodalmerge-studio/plans/blob-cas-remediation.md), per the 8.0 stub convention:
      # RuntimeWebSocketLoopRunner previously had ZERO CI coverage — RuntimeWebSocketLoopRunnerTests
      # (S7.1's observer hook pins included) was named by no workflow step anywhere, the .NET twin
      # of the Rust ws_handler gap filed in 4.2. This workflow is the closest existing home (it
      # already triggers on hosts/dotnet/** and sets up .NET); both suites below are pure-fake
      # (FakeWebSocket/FakeRuntimeCommandBridge, no native FFI needed). Phase 8 may relocate.
      - name: Test runtime WS loop runner
        run: |
          dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj \
            --filter "FullyQualifiedName~RuntimeWebSocketLoopRunnerTests"

      - name: Test runtime WS inbound-pack observer dispatch (6.5)
        run: |
          dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj \
            --filter "FullyQualifiedName~RuntimeWebSocketLoopRunnerObserverDispatchTests"
