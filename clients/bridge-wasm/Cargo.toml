[package]
name = "nodalmerge-bridge"
version = "0.2.0"
edition = "2021"
description = "WASM bridge: exposes nodalmerge-core to JavaScript"
readme = "README.md"
keywords = ["crdt", "sync", "wasm", "javascript"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nodalmerge-core = { version = "0.2.0", path = "../../core/crdt" }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Pure-Rust zstd DECODER only (no C, builds on wasm32-unknown-unknown) for
# slice 3.3's presigned-GET fallback decode in the web SDK. Deliberately not
# the `zstd`/`zstd-sys` C bindings the server crates use — those don't build
# for wasm. Pinned exact: the decoder sits under a content-hash integrity
# check, so an accidental minor bump changing decode behavior should be a
# deliberate, reviewed change.
ruzstd = "=0.8.1"
