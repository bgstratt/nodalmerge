name: control-plane-capability-parity

# Replaces the old authz-conformance-nightly workflow, which compared two
# placeholder "oracles" (a Rust runner that echoed each vector's own expected
# result back as "actual", and a .NET step that mapped vector IDs to
# unrelated pre-existing unit tests) and therefore never caught a real
# regression. This instead runs two small, real tests — one per runtime —
# that each independently assert the live control-plane capability-gating
# behavior against the same canonical table. See:
#   server/server/tests/control_plane_capability_parity.rs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs

on:
  push:
    branches: [main]
    paths:
      - "server/server/src/ws_handler.rs"
      - "server/server/tests/control_plane_capability_parity.rs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/Runtime/RuntimeProtocolMapper.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs"
      - ".github/workflows/control-plane-capability-parity.yml"
  pull_request:
    paths:
      - "server/server/src/ws_handler.rs"
      - "server/server/tests/control_plane_capability_parity.rs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/Runtime/RuntimeProtocolMapper.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs"
      - ".github/workflows/control-plane-capability-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  rust-capability-table:
    name: rust control-plane capability table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run control-plane capability parity test
        run: cargo test -p nodalmerge-server --test control_plane_capability_parity

  dotnet-capability-table:
    name: dotnet control-plane capability table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run control-plane capability parity test
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ControlPlaneCapabilityParityTests"
