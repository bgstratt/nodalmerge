name: authz-conformance-nightly

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      auth_path_benchmark_baseline_run_id:
        description: "Optional benchmark baseline run id"
        required: false
        type: string
      auth_path_benchmark_candidate_run_id:
        description: "Optional benchmark candidate run id"
        required: false
        type: string
      auth_path_benchmark_p50_regression_pct:
        description: "Optional p50 latency regression percentage"
        required: false
        type: string
      auth_path_benchmark_p95_regression_pct:
        description: "Optional p95 latency regression percentage"
        required: false
        type: string
      auth_path_benchmark_alloc_regression_pct:
        description: "Optional allocation regression percentage"
        required: false
        type: string
      auth_path_benchmark_baseline_json_path:
        description: "Optional baseline hosted benchmark JSON path (from benchmark harness output)"
        required: false
        type: string
      auth_path_benchmark_candidate_json_path:
        description: "Optional candidate hosted benchmark JSON path (from benchmark harness output)"
        required: false
        type: string
      auth_path_benchmark_target:
        description: "Optional benchmark target name to compare"
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  sdk-rejection-surface-parity:
    name: sdk rejection surface parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SDK rejection parity check
        run: node docs/acceptance/Check-SdkRejectionParity.mjs

      - name: Upload SDK rejection parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-sdk-parity
          path: docs/acceptance/authz-conformance-sdk-parity.json
          if-no-files-found: error

  canonical-admin-command-only:
    name: canonical admin_command_only
    runs-on: windows-latest
    needs: sdk-rejection-surface-parity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Emit auth-path benchmark evidence (optional)
        shell: pwsh
        env:
          BENCH_BASELINE: ${{ inputs.auth_path_benchmark_baseline_run_id }}
          BENCH_CANDIDATE: ${{ inputs.auth_path_benchmark_candidate_run_id }}
          BENCH_P50: ${{ inputs.auth_path_benchmark_p50_regression_pct }}
          BENCH_P95: ${{ inputs.auth_path_benchmark_p95_regression_pct }}
          BENCH_ALLOC: ${{ inputs.auth_path_benchmark_alloc_regression_pct }}
          BENCH_BASELINE_JSON: ${{ inputs.auth_path_benchmark_baseline_json_path }}
          BENCH_CANDIDATE_JSON: ${{ inputs.auth_path_benchmark_candidate_json_path }}
          BENCH_TARGET: ${{ inputs.auth_path_benchmark_target }}
        run: |
          $haveManual =
            -not [string]::IsNullOrWhiteSpace($env:BENCH_BASELINE) -and
            -not [string]::IsNullOrWhiteSpace($env:BENCH_CANDIDATE) -and
            -not [string]::IsNullOrWhiteSpace($env:BENCH_P50) -and
            -not [string]::IsNullOrWhiteSpace($env:BENCH_P95) -and
            -not [string]::IsNullOrWhiteSpace($env:BENCH_ALLOC)

          $haveJson =
            -not [string]::IsNullOrWhiteSpace($env:BENCH_BASELINE_JSON) -and
            -not [string]::IsNullOrWhiteSpace($env:BENCH_CANDIDATE_JSON)

          if (-not $haveManual -and -not $haveJson) {
            Write-Host "Benchmark evidence inputs not provided; parity will emit auth-path benchmark status=not_evaluated."
            exit 0
          }

          $benchmarkTarget = if ([string]::IsNullOrWhiteSpace($env:BENCH_TARGET)) { "dotnet-host-runtime" } else { $env:BENCH_TARGET }
          $baselineRunId = if ([string]::IsNullOrWhiteSpace($env:BENCH_BASELINE)) { "benchmark-baseline-json" } else { $env:BENCH_BASELINE }
          $candidateRunId = if ([string]::IsNullOrWhiteSpace($env:BENCH_CANDIDATE)) { "gh-${{ github.run_id }}" } else { $env:BENCH_CANDIDATE }

          $cmdArgs = @(
            "-File", ".\docs\acceptance\Write-AuthPathBenchmarkResult.ps1",
            "-BaselineRunId", $baselineRunId,
            "-CandidateRunId", $candidateRunId,
            "-BenchmarkTarget", $benchmarkTarget,
            "-OutPath", ".\docs\acceptance\authz-auth-path-benchmark-result.json"
          )

          if ($haveJson) {
            $cmdArgs += @(
              "-BaselineBenchmarkJsonPath", $env:BENCH_BASELINE_JSON,
              "-CandidateBenchmarkJsonPath", $env:BENCH_CANDIDATE_JSON,
              "-AssumeZeroAllocWhenMissing"
            )
          }

          if ($haveManual) {
            $cmdArgs += @(
              "-P50LatencyRegressionPct", ([double]$env:BENCH_P50),
              "-P95LatencyRegressionPct", ([double]$env:BENCH_P95),
              "-AllocRegressionPct", ([double]$env:BENCH_ALLOC)
            )
          }

          & pwsh @cmdArgs

      - name: Run canonical conformance workflow
        shell: pwsh
        run: |
          $cmdArgs = @(
            "-File", ".\docs\acceptance\Run-AuthzConformance.ps1",
            "-RunId", "gh-${{ github.run_id }}-admin",
            "-PolicyChannelMode", "admin_command_only"
          )

          if (Test-Path .\docs\acceptance\authz-auth-path-benchmark-result.json) {
            $cmdArgs += @("-AuthPathBenchmarkResultPath", "docs/acceptance/authz-auth-path-benchmark-result.json")
          }

          & pwsh @cmdArgs

      - name: Run snapshot restore drill
        shell: pwsh
        run: |
          pwsh -File .\docs\acceptance\Run-SnapshotRestoreDrill.ps1 `
            -RunId "gh-${{ github.run_id }}-snapshot-restore" `
            -OutPath "docs/acceptance/snapshot-restore-drill.json"

      - name: Upload canonical conformance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-admin-command-only
          path: |
            docs/acceptance/authz-conformance-vectors.json
            docs/acceptance/authz-conformance-rust.json
            docs/acceptance/authz-conformance-dotnet.trx
            docs/acceptance/authz-conformance-dotnet-records.json
            docs/acceptance/authz-conformance-parity.json
            docs/acceptance/snapshot-restore-drill.json
          if-no-files-found: error

      - name: Upload auth-path benchmark evidence artifact (optional)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: authz-auth-path-benchmark-evidence
          path: docs/acceptance/authz-auth-path-benchmark-result.json
          if-no-files-found: ignore

  supplemental-noncanonical-profiles:
    name: supplemental ${{ matrix.mode }}
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mode: [hybrid, replicated_signed_ops_only]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run supplemental conformance workflow (non-blocking)
        shell: pwsh
        run: |
          $tag = "supp-${{ matrix.mode }}"
          pwsh -File .\docs\acceptance\Run-AuthzConformance.ps1 `
            -RunId "gh-${{ github.run_id }}-$tag" `
            -PolicyChannelMode ${{ matrix.mode }} `
            -OutputTag $tag `
            -NoFailOnParityMismatch

      - name: Upload supplemental conformance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-${{ matrix.mode }}-supplemental
          path: |
            docs/acceptance/authz-conformance-vectors.json
            docs/acceptance/authz-conformance-rust-supp-${{ matrix.mode }}.json
            docs/acceptance/authz-conformance-dotnet-supp-${{ matrix.mode }}.trx
            docs/acceptance/authz-conformance-dotnet-records-supp-${{ matrix.mode }}.json
            docs/acceptance/authz-conformance-parity-supp-${{ matrix.mode }}.json
          if-no-files-found: error

  supplemental-capcomp-admin:
    name: supplemental capcomp admin_command_only
    runs-on: windows-latest
    continue-on-error: true
    needs: canonical-admin-command-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run supplemental CAPCOMP conformance workflow (non-blocking)
        shell: pwsh
        run: |
          $tag = "supp-capcomp"
          pwsh -File .\docs\acceptance\Run-AuthzConformance.ps1 `
            -RunId "gh-${{ github.run_id }}-$tag" `
            -PolicyChannelMode admin_command_only `
            -IncludeCapCompSupplemental `
            -OutputTag $tag `
            -NoFailOnParityMismatch

      - name: Upload supplemental CAPCOMP conformance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-capcomp-supplemental
          path: |
            docs/acceptance/authz-conformance-vectors.json
            docs/acceptance/authz-conformance-rust-supp-capcomp.json
            docs/acceptance/authz-conformance-dotnet-supp-capcomp.trx
            docs/acceptance/authz-conformance-dotnet-records-supp-capcomp.json
            docs/acceptance/authz-conformance-parity-supp-capcomp.json
          if-no-files-found: error

  promotion-readiness-summary:
    name: promotion readiness summary
    runs-on: windows-latest
    if: ${{ always() }}
    needs:
      - canonical-admin-command-only
      - supplemental-capcomp-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical parity artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: authz-conformance-admin-command-only
          path: _artifacts/canonical

      - name: Download CAPCOMP supplemental parity artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: authz-conformance-capcomp-supplemental
          path: _artifacts/capcomp

      - name: Build promotion readiness summary artifact
        shell: pwsh
        run: |
          pwsh -File .\docs\acceptance\Summarize-AuthzPromotionReadiness.ps1 `
            -CanonicalParityPath .\_artifacts\canonical\authz-conformance-parity.json `
            -CapcompParityPath .\_artifacts\capcomp\authz-conformance-parity-supp-capcomp.json `
            -OutPath .\docs\acceptance\promotion-readiness.json

      - name: Upload promotion readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-promotion-readiness
          path: docs/acceptance/promotion-readiness.json
          if-no-files-found: error

  promotion-readiness-history:
    name: promotion readiness history
    runs-on: windows-latest
    if: ${{ always() }}
    needs:
      - promotion-readiness-summary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download promotion readiness artifact
        uses: actions/download-artifact@v4
        with:
          name: authz-conformance-promotion-readiness
          path: _artifacts/promotion

      - name: Restore promotion history cache
        id: restore-history
        uses: actions/cache/restore@v4
        with:
          path: _history
          key: authz-promotion-history-${{ github.run_id }}
          restore-keys: |
            authz-promotion-history-

      - name: Ensure history directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\_history -Force | Out-Null

      - name: Append promotion readiness history
        shell: pwsh
        run: |
          pwsh -File .\docs\acceptance\Append-AuthzPromotionReadinessHistory.ps1 `
            -SnapshotPath .\_artifacts\promotion\promotion-readiness.json `
            -HistoryPath .\_history\promotion-readiness-history.jsonl `
            -SummaryPath .\_history\promotion-readiness-history-summary.json `
            -WorkflowRunId "${{ github.run_id }}" `
            -WorkflowRunNumber "${{ github.run_number }}"

      - name: Emit gate summary
        shell: pwsh
        run: |
          $snapshotPath = ".\_artifacts\promotion\promotion-readiness.json"
          $historySummaryPath = ".\_history\promotion-readiness-history-summary.json"

          if (-not (Test-Path $snapshotPath)) {
            throw "Promotion snapshot not found: $snapshotPath"
          }
          if (-not (Test-Path $historySummaryPath)) {
            throw "Promotion history summary not found: $historySummaryPath"
          }

          $snapshot = Get-Content -Raw -Path $snapshotPath | ConvertFrom-Json
          $historySummary = Get-Content -Raw -Path $historySummaryPath | ConvertFrom-Json

          $gateVerdict = if ($null -ne $snapshot.streak -and $null -ne $snapshot.streak.gate_verdict) { [string]$snapshot.streak.gate_verdict } else { "NOT_EVALUATED" }
          $capcompStreakEvent = if ($null -ne $snapshot.capcomp) { [string]$snapshot.capcomp.streak_event } else { "not_evaluated" }
          $benchmarkStreakEvent = if ($null -ne $snapshot.benchmark) { [string]$snapshot.benchmark.streak_event } else { "not_evaluated" }
          $gateConsecutive = if ($null -ne $historySummary.streaks) { [int]$historySummary.streaks.gate_verdict_consecutive_passes } else { 0 }
          $gateReady = if ($null -ne $historySummary.streaks) { [bool]$historySummary.streaks.gate_verdict_ready } else { $false }

          Write-Host "Gate verdict: $gateVerdict"
          Write-Host "CAPCOMP streak event: $capcompStreakEvent"
          Write-Host "Benchmark streak event: $benchmarkStreakEvent"
          Write-Host "Gate verdict consecutive passes: $gateConsecutive"
          Write-Host "Gate verdict ready: $gateReady"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AuthZ Promotion Gate Summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- gate_verdict: $gateVerdict"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- capcomp_streak_event: $capcompStreakEvent"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- benchmark_streak_event: $benchmarkStreakEvent"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- gate_verdict_consecutive_passes: $gateConsecutive"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- gate_verdict_ready: $gateReady"

      - name: Upload promotion readiness history artifact
        uses: actions/upload-artifact@v4
        with:
          name: authz-conformance-promotion-readiness-history
          path: |
            _history/promotion-readiness-history.jsonl
            _history/promotion-readiness-history-summary.json
          if-no-files-found: error

      - name: Save promotion history cache
        uses: actions/cache/save@v4
        with:
          path: _history
          key: authz-promotion-history-${{ github.run_id }}
