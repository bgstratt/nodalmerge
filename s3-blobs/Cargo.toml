[package]
name = "activesync-s3-blobs"
version = "0.1.0"
edition = "2021"
description = "S3-compatible BlobPersistence backend for activesync-server (AWS, R2, MinIO, GCS, Azure)."

[dependencies]
activesync-core = { path = "../core" }
activesync-server = { path = "../server" }
object_store = { version = "0.11", features = ["aws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tracing = "0.1"
thiserror = { workspace = true }
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true }
testcontainers = { version = "0.23", features = ["blocking"] }
tempfile = "3"
tracing-subscriber = "0.3"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
