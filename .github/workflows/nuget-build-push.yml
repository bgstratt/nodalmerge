name: nuget-build-push

on:
  push:
    branches: [main]
    paths:
      - 'nodalmerge-host/src/**'
      - 'nodalmerge-host/NodalMerge.DotNetHost.slnx'
      - 'host-ffi/**'
      - 'wrappers/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nuget-build-push.yml'
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Optional package version override
        required: false
        type: string
      publishNpmWrappers:
        description: Publish nodalmerge npm wrappers (requires npmPublishToken input)
        required: false
        default: false
        type: boolean
      npmPublishToken:
        description: npm publish token for wrapper publish jobs
        required: false
        type: string
      publishCrateWrappers:
        description: Publish nodalmerge wrapper crates (requires cargoRegistryToken input)
        required: false
        default: false
        type: boolean
      cargoRegistryToken:
        description: crates.io token for wrapper publish jobs
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 20
  NUGET_OUTPUT_DIR: ${{ github.workspace }}/artifacts/nuget

jobs:
  wrapper-smoke:
    name: wrapper smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check all nodalmerge wrappers
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p nodalmerge-core \
            -p nodalmerge-gc \
            -p nodalmerge-host-core \
            -p nodalmerge-host-axum \
            -p nodalmerge-host-ffi \
            -p nodalmerge-server \
            -p nodalmerge-jwt-bridge \
            -p nodalmerge-s3-blobs \
            -p nodalmerge-mongo-store \
            -p nodalmerge-postgres-store \
            -p nodalmerge-nodestore-conformance

  pack-npm-wrappers:
    name: pack npm wrappers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pack nodalmerge npm wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/npm"

          pushd wrappers/npm/nodalmerge-bridge >/dev/null
          npm pack --dry-run
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          popd >/dev/null

          pushd wrappers/npm/nodalmerge-sdk-js >/dev/null
          npm pack --dry-run
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          popd >/dev/null

      - name: Upload npm wrapper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-wrappers
          path: ${{ github.workspace }}/artifacts/npm/*.tgz
          if-no-files-found: error

  pack-crate-wrappers:
    name: pack crate wrappers
    needs:
      - wrapper-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package nodalmerge wrapper crates
        shell: bash
        run: |
          set -euo pipefail
          cargo package --package nodalmerge-core --no-verify
          cargo package --package nodalmerge-gc --no-verify
          cargo package --package nodalmerge-host-core --no-verify
          cargo package --package nodalmerge-host-axum --no-verify
          cargo package --package nodalmerge-host-ffi --no-verify
          cargo package --package nodalmerge-server --no-verify
          cargo package --package nodalmerge-jwt-bridge --no-verify
          cargo package --package nodalmerge-s3-blobs --no-verify
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crates"
          cp target/package/nodalmerge-*.crate "$GITHUB_WORKSPACE/artifacts/crates/"

      - name: Upload crate wrapper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crate-wrappers
          path: ${{ github.workspace }}/artifacts/crates/*.crate
          if-no-files-found: error

  publish-npm-wrappers:
    name: publish npm wrappers
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publishNpmWrappers == 'true'
    needs:
      - pack-npm-wrappers
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm wrapper artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-wrappers
          path: ${{ github.workspace }}/artifacts/npm

      - name: Publish nodalmerge npm wrappers
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.event.inputs.npmPublishToken }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required for publishNpmWrappers=true"
            exit 1
          fi
          npm publish "$GITHUB_WORKSPACE/artifacts/npm/nodalmerge-bridge-"*.tgz --access public
          npm publish "$GITHUB_WORKSPACE/artifacts/npm/nodalmerge-sdk-js-"*.tgz --access public

  publish-crate-wrappers:
    name: publish crate wrappers
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publishCrateWrappers == 'true'
    needs:
      - pack-crate-wrappers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish nodalmerge wrapper crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ github.event.inputs.cargoRegistryToken }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required for publishCrateWrappers=true"
            exit 1
          fi
          cargo publish -p nodalmerge-core
          cargo publish -p nodalmerge-gc
          cargo publish -p nodalmerge-host-core
          cargo publish -p nodalmerge-host-axum
          cargo publish -p nodalmerge-host-ffi
          cargo publish -p nodalmerge-server
          cargo publish -p nodalmerge-jwt-bridge
          cargo publish -p nodalmerge-s3-blobs
  pack-managed:
    name: pack managed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.packageVersion }}" ]; then
            echo "value=${{ github.event.inputs.packageVersion }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore solution
        run: dotnet restore nodalmerge-host/NodalMerge.DotNetHost.slnx

      - name: Pack NodalMerge.Host.Abstractions
        run: dotnet pack nodalmerge-host/src/NodalMerge.Host.Abstractions/NodalMerge.Host.Abstractions.csproj -c Release -o "$NUGET_OUTPUT_DIR" --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Pack NodalMerge.Host.Composition
        run: dotnet pack nodalmerge-host/src/NodalMerge.Host.Composition/NodalMerge.Host.Composition.csproj -c Release -o "$NUGET_OUTPUT_DIR" --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Upload managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-managed
          path: ${{ env.NUGET_OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error

  pack-native-linux:
    name: pack native linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.packageVersion }}" ]; then
            echo "value=${{ github.event.inputs.packageVersion }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build host ffi release library
        run: cargo build -p nodalmerge-host-ffi --release

      - name: Pack NodalMerge.DotNetHost.Native.linux-x64
        run: dotnet pack nodalmerge-host/src/NodalMerge.DotNetHost.Native.linux-x64/NodalMerge.DotNetHost.Native.linux-x64.csproj -c Release -o "$NUGET_OUTPUT_DIR" --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Upload linux native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-native-linux-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error

  pack-native-win:
    name: pack native win-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace('${{ github.event.inputs.packageVersion }}')) {
            "value=${{ github.event.inputs.packageVersion }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "value=0.1.0-preview.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build host ffi release library
        run: cargo build -p nodalmerge-host-ffi --release

      - name: Pack NodalMerge.DotNetHost.Native.win-x64
        run: dotnet pack nodalmerge-host/src/NodalMerge.DotNetHost.Native.win-x64/NodalMerge.DotNetHost.Native.win-x64.csproj -c Release -o "$env:NUGET_OUTPUT_DIR" --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Upload windows native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-native-win-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error

  pack-dotnethost:
    name: pack NodalMerge.DotNetHost
    needs:
      - pack-managed
      - pack-native-linux
      - pack-native-win
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.packageVersion }}" ]; then
            echo "value=${{ github.event.inputs.packageVersion }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # NodalMerge.DotNetHost.csproj only references the Abstractions/Composition/Native.*
      # packages (rather than its sibling projects) when built with NodalMergeUseNuGetPackages=true
      # — its default, project-reference-only mode never touches the native packages at all, which
      # is exactly why 0.1.2 shipped with no native dependency declared. Packing it correctly here
      # needs those sibling packages already built (hence needs: above) and restorable, so they're
      # downloaded into a local folder feed and passed via --source.
      - name: Download managed packages (Abstractions/Composition)
        uses: actions/download-artifact@v4
        with:
          name: nuget-managed
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Download linux native package
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-linux-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Download windows native package
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-win-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Pack NodalMerge.DotNetHost
        run: |
          dotnet pack nodalmerge-host/src/NodalMerge.DotNetHost/NodalMerge.DotNetHost.csproj -c Release -o "$NUGET_OUTPUT_DIR" \
            /p:Version=${{ steps.version.outputs.value }} \
            /p:NodalMergeUseNuGetPackages=true \
            /p:NodalMergePackageVersion=${{ steps.version.outputs.value }} \
            --source "$NUGET_OUTPUT_DIR" --source https://api.nuget.org/v3/index.json

      - name: Upload NodalMerge.DotNetHost artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-dotnethost
          path: ${{ env.NUGET_OUTPUT_DIR }}/NodalMerge.DotNetHost.*.nupkg
          if-no-files-found: error

  publish:
    name: publish github packages
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs:
      - pack-managed
      - pack-native-linux
      - pack-native-win
      - pack-dotnethost
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download managed packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-managed
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Download linux native packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-linux-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Download windows native packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-native-win-x64
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Download NodalMerge.DotNetHost package
        uses: actions/download-artifact@v4
        with:
          name: nuget-dotnethost
          path: ${{ env.NUGET_OUTPUT_DIR }}

      - name: Add GitHub Packages source
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Push packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "$env:NUGET_OUTPUT_DIR" -Filter *.nupkg -Recurse | Where-Object { $_.Name -notlike '*.snupkg' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          }
