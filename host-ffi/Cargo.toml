[package]
name = "activesync-host-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI wrapper for activesync host-core"
readme = "README.md"
keywords = ["crdt", "sync", "ffi", "host"]
categories = ["api-bindings", "network-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
activesync-host-core = { version = "0.1.0", path = "../host-core" }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
activesync-core = { version = "0.1.0", path = "../core" }
activesync-host-core = { version = "0.1.0", path = "../host-core" }
base64 = "0.22"
criterion = { workspace = true }
ed25519-dalek = { workspace = true }

[[bench]]
name = "host_runtime_vs_ffi"
harness = false
