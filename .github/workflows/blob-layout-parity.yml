name: blob-layout-parity

# Asserts the Rust and .NET blob storage implementations against two
# canonical contracts:
#   docs/BLOB_STORAGE_LAYOUT.md                  (contract: file/S3 layout,
#                                                 delegate protocol v1)
#   docs/BLOB_LAYOUT_CONVERGENCE_PLAN.md         (rationale/history)
#   docs/BLOB_HTTP_SURFACE.md                    (contract: GET/HEAD/PUT
#                                                 /blobs/{hash} origin, S2.1b)
#   engine/commands/blob-layout-vectors.v1.json  (path/key/name/delegate
#                                                 vectors, source of truth)
#   engine/commands/blob-http-surface-vectors.v1.json (HTTP origin vectors,
#                                                 source of truth)
#   engine/commands/fixtures/blob-layout-v1/     (golden cross-runtime
#                                                 fixture tree)
#   engine/commands/zstd-interop-vectors.v1.json (cross-runtime zstd fixture
#                                                 manifest, slice 0.1 of
#                                                 blob-cas-remediation.md)
#   engine/commands/fixtures/zstd-interop-v1/    (golden cross-runtime zstd
#                                                 frame fixtures)
#   server/server/tests/blob_layout_vectors.rs
#   server/server/tests/blob_layout_interop.rs
#   server/server/tests/blob_http_surface.rs
#   server/server/tests/zstd_interop.rs           (rust-as-consumer only: Rust
#                                                 decoding a .NET-produced
#                                                 frame was already green
#                                                 pre-3.1, since Rust's
#                                                 decode_all handles both
#                                                 content-size-header shapes.
#                                                 The other, previously-broken
#                                                 direction — .NET decoding a
#                                                 *Rust*-produced frame — is
#                                                 pinned by ZstdInteropTests.cs
#                                                 below, not here)
#   server/server/tests/tree_walk_depth.rs       (slice 1.5 / finding #9 — a
#                                                 deep single-entry tree-blob
#                                                 chain must fail closed with
#                                                 TreeWalkError::TooDeep rather
#                                                 than overflowing the worker
#                                                 stack and aborting the
#                                                 process. NOTE: tree_walk.rs
#                                                 itself was absent from the
#                                                 paths: filters below until
#                                                 1.5 — a step alone does not
#                                                 make a suite run; the trigger
#                                                 must list the source file the
#                                                 suite guards, or the workflow
#                                                 never fires on the PR that
#                                                 breaks it)
#   server/server/src/gc_store.rs                (the GC asset inventory whose
#                                                 `Active` rows blob_gc.rs's
#                                                 slice-1.3 union tests drive
#                                                 through `Rooms::sweep_blobs`
#                                                 via a real `SqliteGcStore`;
#                                                 `iter_unmarked_candidates`'s
#                                                 semantics ARE that union's
#                                                 contract. Added by slice 1.3 —
#                                                 blob_gc.rs had a step here but
#                                                 this file could not trigger it)
#   server/s3-blobs/src/lib.rs (blob_layout_vectors_match_s3_key_derivation;
#                                                 its blob_gc_sweep two-phase
#                                                 grace is gated for real by
#                                                 .github/workflows/blob-s3-gc-minio.yml
#                                                 — the NonHydratingBackend port
#                                                 this workflow's blob_gc step
#                                                 uses is a copy, not the backend)
#   server/s3-blobs/tests/bridge_timeouts.rs (slice 6.1, finding #11 — every
#                                                 sync→async bridge op against
#                                                 a stalled endpoint must fail
#                                                 bounded and classify as a
#                                                 backend error, never missing.
#                                                 Docker-free: the stalled
#                                                 endpoint is an in-test
#                                                 TcpListener, so it lives here
#                                                 rather than blob-s3-gc-minio.yml)
#   server/server/tests/blob_http_offload.rs (slice 6.2 — the blob HTTP
#                                                 handlers must run their
#                                                 blocking work (store I/O,
#                                                 BLAKE3, zstd, the 6.1 S3
#                                                 bridge) on the blocking
#                                                 pool, never in-line on the
#                                                 async workers; deterministic
#                                                 starvation probes + the
#                                                 panic-in-blocking-op→500
#                                                 pin. Docker-free: the slow
#                                                 store is an in-test fake)
#   server/server/tests/blob_put_durability.rs (slice 4.2, finding #8 — PUT
#                                                 must not lie about durability:
#                                                 a failed persist_blob answers
#                                                 503 (backend unavailable) or
#                                                 500 (write failed), leaves NO
#                                                 Active GC-inventory row, and a
#                                                 later GET/HEAD agrees. Real
#                                                 DirPersistence fs failure +
#                                                 injectable fake + S3BlobStore
#                                                 vs a stalled TcpListener —
#                                                 Docker-free, so it lives here)
#   server/server/tests/blob_relay_nonhydrating_backend.rs (S4.2 relay
#                                                 contract; previously shipped
#                                                 without a CI step — added
#                                                 alongside slice 0.2 of
#                                                 blob-cas-remediation.md
#                                                 while its fake was promoted
#                                                 to nodalmerge-blobstore-conformance)
#   server/server/tests/blob_nonhydrating_conformance.rs (slice 0.2's
#                                                 non-hydrating-backend
#                                                 conformance harness — GC
#                                                 live-set / tree-walk /
#                                                 archive-export scenarios
#                                                 against S3BlobStore's real
#                                                 shape; the RED scenarios
#                                                 that gate Phase 2 are
#                                                 `#[ignore]`d and skipped by
#                                                 this step until their slice
#                                                 ships)
#   hosts/dotnet/…/BlobCompression.cs             (slice 3.1's fix — see the
#                                                 ZstdInteropTests.cs entry
#                                                 below. Was missing from the
#                                                 paths: filters until the CI
#                                                 follow-up for 3.1: the file
#                                                 that was actually fixed
#                                                 could not trigger this
#                                                 workflow)
#   hosts/dotnet/…/ServiceCollectionExtensions.cs (the DI composition root —
#                                                 every .NET test below reaches
#                                                 File/S3Delegated provider
#                                                 wiring through
#                                                 AddNodalMergeHostProviders.
#                                                 Added by the 3.1 CI
#                                                 follow-up audit: a wiring
#                                                 regression here (e.g. which
#                                                 provider "File" resolves to)
#                                                 could break every test below
#                                                 with no trigger)
#   hosts/dotnet/…/NodalMergeHostProviderOptions.cs (parses which provider
#                                                 each test's config selects;
#                                                 same audit, same reasoning)
#   hosts/dotnet/…/FileBlobStorageOptions.cs      (binds Compression/
#                                                 CompressionLevel/
#                                                 CompressionMinBytes — the
#                                                 config surface that decides
#                                                 whether BlobCompression is
#                                                 even invoked; same audit)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs (slice
#                                                 3.1, finding #4 — pins the
#                                                 direction that was actually
#                                                 broken: .NET decoding a
#                                                 header-less zstd frame
#                                                 produced by Rust's
#                                                 zstd::stream::encode_all.
#                                                 BlobCompression.TryDecompress
#                                                 used to require
#                                                 written == buffer.Length
#                                                 after sizing the output
#                                                 buffer from
#                                                 Decompressor.GetDecompressedSize,
#                                                 which returns only an upper
#                                                 bound (the zstd default
#                                                 window size) for frames
#                                                 without a content-size
#                                                 header — every frame Rust's
#                                                 at-rest encoder produces — so
#                                                 every cross-runtime
#                                                 compressed fetch was
#                                                 rejected as "corrupt zstd
#                                                 frame." Fixed by accepting
#                                                 written <= buffer.Length.
#                                                 A Rust-only interop test
#                                                 (zstd_interop.rs above)
#                                                 cannot catch a regression
#                                                 here: it only proves Rust
#                                                 can still read a .NET frame,
#                                                 never that .NET can read a
#                                                 Rust one — hence this
#                                                 dedicated dotnet CI step,
#                                                 added alongside the CI
#                                                 follow-up for slice 3.1)
#   hosts/dotnet/src/NodalMerge.Host.Abstractions/Providers/IBlobStoreProvider.cs
#                                                 (slice 2.1's new ExistsAsync
#                                                 default member)
#   hosts/dotnet/src/NodalMerge.Host.Composition/HttpRemoteBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobOriginOptions.cs
#                                                 (slice 3.3, finding #6 — the
#                                                 Compression default flipped
#                                                 Zstd -> Off; pinned by
#                                                 S3DirectBlobOriginOptionsTests)
#   hosts/dotnet/src/NodalMerge.Host.Composition/ChainedBlobStoreProvider.cs
#   hosts/dotnet/src/NodalMerge.DotNetHost/WebApplicationExtensions.cs   (HEAD +
#                                                 PUT-idempotency call sites
#                                                 slice 2.1 routes through
#                                                 ExistsAsync instead of a full
#                                                 TryGetBlobAsync read)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NonHydratingBlobBackendConformanceTests.cs
#                                                 (slice 0.2's .NET half — both
#                                                 tests were RED/Skip-gated
#                                                 until slice 2.1 un-gated them;
#                                                 now green and run below)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobStoreProviderExistsAsyncDefaultTests.cs
#                                                 (slice 2.1's ⚠ compat pin: a
#                                                 provider implementing ONLY
#                                                 the two original
#                                                 IBlobStoreProvider members
#                                                 still compiles and still
#                                                 answers ExistsAsync correctly
#                                                 via the default)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderExistsAsyncTests.cs
#                                                 (slice 2.1 — FileBlobStoreProvider's
#                                                 cheap File.Exists override)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpEncodingNegotiationTests.cs
#                                                 (slice 2.1 changed
#                                                 Head_ignores_accept_encoding_and_behaves_as_before's
#                                                 expectation: HEAD no longer
#                                                 sets Content-Length, matching
#                                                 the Rust reference and the
#                                                 frozen head-found vector.
#                                                 This file previously ran in
#                                                 NO workflow at all — added
#                                                 below alongside the fix that
#                                                 depends on it)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/HttpRemoteBlobStoreProviderTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobStoreProviderTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ChainedBlobStoreProviderTests.cs
#                                                 (these three previously ran
#                                                 in NO workflow either — slice
#                                                 2.1 added ExistsAsync
#                                                 overrides/composition to all
#                                                 three providers, so their
#                                                 suites are wired in below.
#                                                 RemoteBlobLinkAggregatorTests.cs
#                                                 joined them: the aggregator IS
#                                                 the single "remote" the chain
#                                                 sees once >1 remote link is
#                                                 configured, so it needed its
#                                                 own ExistsAsync override or
#                                                 2.1's benefit silently
#                                                 vanished for the three-link
#                                                 deployment.
#                                                 Sibling files this same audit
#                                                 found equally uncovered —
#                                                 ChainedBlobStoreProviderHttpIntegrationTests.cs,
#                                                 S3DirectChainCompositionTests.cs
#                                                 — are NOT touched by slice
#                                                 2.1's production changes and
#                                                 are left for the broader CI
#                                                 follow-up, now tracked as
#                                                 Phase 8 (deferred) in
#                                                 blob-cas-remediation.md.
#                                                 ProviderS3DelegatedBlobResolverIntegrationTests.cs
#                                                 was ALSO on that uncovered
#                                                 list until slice 4.1 pulled it
#                                                 forward — see below, same
#                                                 reasoning 1.3 used for
#                                                 minio_round_trip.rs: a slice
#                                                 whose production change this
#                                                 suite actually exercises
#                                                 shouldn't wait for Phase 8.)
#   hosts/dotnet/src/NodalMerge.DotNetHost/BlobHttpOptions.cs (slice 4.3.1 —
#                                                 Validate() rejects
#                                                 non-positive MaxBlobBytes at
#                                                 startup instead of 500ing the
#                                                 first chunked PUT or silently
#                                                 413ing everything)
#   hosts/dotnet/src/NodalMerge.Host.Composition/RemoteBlobOriginOptions.cs
#                                                 (slice 4.3.2 — ResolveBaseUri()
#                                                 guarantees a trailing "/" so a
#                                                 reverse-proxy path prefix in
#                                                 BaseUrl survives into every
#                                                 request HttpRemoteBlobStoreProvider
#                                                 / S3DirectBlobStoreProvider send)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/LegacySyncBlobUrlCompatTests.cs
#                                                 (slice 4.1, finding #12 — new
#                                                 file, golden tests for legacy
#                                                 /sync/blob-url restored to
#                                                 `main`'s pre-existing
#                                                 behavior: unix-seconds
#                                                 expiresAt, 404 not 501 for no
#                                                 backend, loose/anonymous hash
#                                                 handling — deliberately
#                                                 different from the new frozen
#                                                 /blobs/{hash}/url route)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderHttpEndpointTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderS3DelegatedBlobResolverIntegrationTests.cs
#                                                 (slice 4.1 — both pre-existing
#                                                 files exercised /sync/blob-url
#                                                 under the WRONG (S4.1-alias)
#                                                 assumptions the finding #12
#                                                 fix corrects (expiresAtUtc,
#                                                 501, canonical-hash
#                                                 rejection); fixed in place to
#                                                 assert `main`'s restored
#                                                 shape. ProviderS3DelegatedBlobResolverIntegrationTests.cs
#                                                 pulled forward from the Phase
#                                                 8 backlog noted above, since
#                                                 this slice's change is exactly
#                                                 what it exercises.
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpOptionsValidationTests.cs
#                                                 (slice 4.3.1, new file)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobOriginBaseUrlPathPrefixTests.cs
#                                                 (slice 4.3.2, new file — both
#                                                 HttpRemoteBlobStoreProvider and
#                                                 S3DirectBlobStoreProvider,
#                                                 both trailing-slash BaseUrl
#                                                 spellings)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DelegatedBlobOptionsStaleKeyGuardTests.cs
#                                                 (slice 4.3.3, new file — warns,
#                                                 does not hard-fail, on stale
#                                                 PutPath/GetPath config keys)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobIdentityVerifyTests.cs
#                                                 (slice 3.2, finding #13 — new
#                                                 file, pins FileBlobStoreProvider's
#                                                 identity-path BLAKE3 verify-on-read:
#                                                 a tampered identity blob file must
#                                                 read as Missing, matching the zstd
#                                                 path and Rust's DirPersistence::get_blob,
#                                                 never served as a hit)
#   NOTE: slice 3.2's fix exposed that several pre-existing tests keyed blob
#   fixtures by fabricated placeholder hashes (e.g. "sha256:abc") rather than
#   the real BLAKE3 hash of the bytes they stored — silently relying on the
#   identity path's prior lack of verification. Fixed alongside 3.2 in
#   ProviderDurabilityTests.cs, Row19AutomatedScenarioHarnessTests.cs, and
#   ProviderHostRestartDurabilityIntegrationTests.cs (now keyed by
#   Hasher.Hash(bytes)). None of those three files run in any CI workflow
#   today — a pre-existing gap this slice did not introduce, already tracked
#   under the Phase 8 CI follow-up above; not added here since the fixes are
#   fixture-shape corrections, not new coverage for this workflow's contract.

on:
  push:
    branches: [main]
    paths:
      - "engine/commands/blob-layout-vectors.v1.json"
      - "engine/commands/blob-http-surface-vectors.v1.json"
      - "engine/commands/fixtures/blob-layout-v1/**"
      - "engine/commands/zstd-interop-vectors.v1.json"
      - "engine/commands/fixtures/zstd-interop-v1/**"
      - "server/server/src/store.rs"
      - "server/server/src/room.rs"
      - "server/server/src/tree_walk.rs"
      - "server/server/src/blob_http.rs"
      - "server/server/src/gc_store.rs"
      - "server/server/src/main.rs"
      - "server/dev-server/src/main.rs"
      - "server/axum-embed/src/lib.rs"
      - "server/server/tests/blob_layout_vectors.rs"
      - "server/server/tests/blob_layout_interop.rs"
      - "server/server/tests/blob_gc.rs"
      - "server/server/tests/tree_walk_depth.rs"
      - "server/server/tests/blob_http_surface.rs"
      - "server/server/tests/zstd_interop.rs"
      - "server/server/tests/blob_relay_nonhydrating_backend.rs"
      - "server/server/tests/blob_nonhydrating_conformance.rs"
      # slice 2.2 — blob_nonhydrating_conformance.rs drives the studio GC entry
      # point (collect_studio_live_hashes), the ONLY place walk_tree is reachable
      # from GC. Without this line a change to the live-set walk could break that
      # suite's whole reason for existing without ever firing it.
      - "server/server/src/studio_live_hashes.rs"
      # slice 2.3 (finding #7) — blob_nonhydrating_conformance.rs drives archive
      # describe AND the manifest-document export path (two SEPARATE functions,
      # each with its own blob-resolution site). Without these lines a change to
      # either could silently reintroduce the empty-set blobs digest without the
      # suite that guards it ever firing.
      - "server/server/src/archive_adapter.rs"
      - "server/server/src/archive_export.rs"
      - "server/stores/blob-conformance/**"
      - "server/s3-blobs/src/lib.rs"
      # slice 2.2 — Delegate-mode fail-loud gate. Docker-free (Delegate opens no
      # connection), so it lives in this workflow rather than blob-s3-gc-minio.yml.
      - "server/s3-blobs/tests/delegate_gc.rs"
      # slice 6.1 (finding #11) — stalled-endpoint bridge/timeout gate. Docker-free
      # (the stalled endpoint is an in-test TcpListener), so it lives in this
      # workflow rather than blob-s3-gc-minio.yml.
      - "server/s3-blobs/tests/bridge_timeouts.rs"
      # slice 6.2 — blob HTTP off-worker scheduling gate: blocking store work
      # (I/O, BLAKE3, zstd, the 6.1 S3 bridge) must run on the blocking pool,
      # never park the async workers; a panic in the offloaded op maps to 500.
      # Docker-free (the slow store is an in-test fake), so it lives here.
      - "server/server/tests/blob_http_offload.rs"
      # slice 4.2 (finding #8) — PUT durability truthfulness gate: a failed
      # persist must answer 5xx (503 unavailable / 500 write-failed) and leave
      # NO Active inventory row; GET/HEAD stay consistent. Covers Dir (real fs
      # failure), an injectable failing fake, and S3BlobStore against a stalled
      # TcpListener — Docker-free by the same reasoning as bridge_timeouts.rs,
      # so it lives here rather than blob-s3-gc-minio.yml.
      - "server/server/tests/blob_put_durability.rs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/BlobCompression.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStorageOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobGcCoordinator.cs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/BlobHttpOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/RemoteBlobOriginOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobUrlResolverProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/ServiceCollectionExtensions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/NodalMergeHostProviderOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Abstractions/Providers/IBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/HttpRemoteBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobOriginOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/ChainedBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/RemoteBlobLinkAggregator.cs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/WebApplicationExtensions.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobGcCoordinatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderMigrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NonHydratingBlobBackendConformanceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobStoreProviderExistsAsyncDefaultTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderExistsAsyncTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobIdentityVerifyTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpEncodingNegotiationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/HttpRemoteBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobOriginOptionsTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ChainedBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/RemoteBlobLinkAggregatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/LegacySyncBlobUrlCompatTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderHttpEndpointTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderS3DelegatedBlobResolverIntegrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpOptionsValidationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobOriginBaseUrlPathPrefixTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DelegatedBlobOptionsStaleKeyGuardTests.cs"
      - ".github/workflows/blob-layout-parity.yml"
  pull_request:
    paths:
      - "engine/commands/blob-layout-vectors.v1.json"
      - "engine/commands/blob-http-surface-vectors.v1.json"
      - "engine/commands/fixtures/blob-layout-v1/**"
      - "engine/commands/zstd-interop-vectors.v1.json"
      - "engine/commands/fixtures/zstd-interop-v1/**"
      - "server/server/src/store.rs"
      - "server/server/src/room.rs"
      - "server/server/src/tree_walk.rs"
      - "server/server/src/blob_http.rs"
      - "server/server/src/gc_store.rs"
      - "server/server/src/main.rs"
      - "server/dev-server/src/main.rs"
      - "server/axum-embed/src/lib.rs"
      - "server/server/tests/blob_layout_vectors.rs"
      - "server/server/tests/blob_layout_interop.rs"
      - "server/server/tests/blob_gc.rs"
      - "server/server/tests/tree_walk_depth.rs"
      - "server/server/tests/blob_http_surface.rs"
      - "server/server/tests/zstd_interop.rs"
      - "server/server/tests/blob_relay_nonhydrating_backend.rs"
      - "server/server/tests/blob_nonhydrating_conformance.rs"
      # slice 2.2 — blob_nonhydrating_conformance.rs drives the studio GC entry
      # point (collect_studio_live_hashes), the ONLY place walk_tree is reachable
      # from GC. Without this line a change to the live-set walk could break that
      # suite's whole reason for existing without ever firing it.
      - "server/server/src/studio_live_hashes.rs"
      # slice 2.3 (finding #7) — blob_nonhydrating_conformance.rs drives archive
      # describe AND the manifest-document export path (two SEPARATE functions,
      # each with its own blob-resolution site). Without these lines a change to
      # either could silently reintroduce the empty-set blobs digest without the
      # suite that guards it ever firing.
      - "server/server/src/archive_adapter.rs"
      - "server/server/src/archive_export.rs"
      - "server/stores/blob-conformance/**"
      - "server/s3-blobs/src/lib.rs"
      # slice 2.2 — Delegate-mode fail-loud gate. Docker-free (Delegate opens no
      # connection), so it lives in this workflow rather than blob-s3-gc-minio.yml.
      - "server/s3-blobs/tests/delegate_gc.rs"
      # slice 6.1 (finding #11) — stalled-endpoint bridge/timeout gate. Docker-free
      # (the stalled endpoint is an in-test TcpListener), so it lives in this
      # workflow rather than blob-s3-gc-minio.yml.
      - "server/s3-blobs/tests/bridge_timeouts.rs"
      # slice 6.2 — blob HTTP off-worker scheduling gate: blocking store work
      # (I/O, BLAKE3, zstd, the 6.1 S3 bridge) must run on the blocking pool,
      # never park the async workers; a panic in the offloaded op maps to 500.
      # Docker-free (the slow store is an in-test fake), so it lives here.
      - "server/server/tests/blob_http_offload.rs"
      # slice 4.2 (finding #8) — PUT durability truthfulness gate: a failed
      # persist must answer 5xx (503 unavailable / 500 write-failed) and leave
      # NO Active inventory row; GET/HEAD stay consistent. Covers Dir (real fs
      # failure), an injectable failing fake, and S3BlobStore against a stalled
      # TcpListener — Docker-free by the same reasoning as bridge_timeouts.rs,
      # so it lives here rather than blob-s3-gc-minio.yml.
      - "server/server/tests/blob_put_durability.rs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/BlobCompression.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobStorageOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/FileBlobGcCoordinator.cs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/BlobHttpOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/RemoteBlobOriginOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DelegatedBlobUrlResolverProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/ServiceCollectionExtensions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/NodalMergeHostProviderOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Abstractions/Providers/IBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/HttpRemoteBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/S3DirectBlobOriginOptions.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/ChainedBlobStoreProvider.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/RemoteBlobLinkAggregator.cs"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/WebApplicationExtensions.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobLayoutInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobGcCoordinatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderMigrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpSurfaceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ZstdInteropTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NonHydratingBlobBackendConformanceTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobStoreProviderExistsAsyncDefaultTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobStoreProviderExistsAsyncTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/FileBlobIdentityVerifyTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpEncodingNegotiationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/HttpRemoteBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DirectBlobOriginOptionsTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ChainedBlobStoreProviderTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/RemoteBlobLinkAggregatorTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/LegacySyncBlobUrlCompatTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderHttpEndpointTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ProviderS3DelegatedBlobResolverIntegrationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobHttpOptionsValidationTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/BlobOriginBaseUrlPathPrefixTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/S3DelegatedBlobOptionsStaleKeyGuardTests.cs"
      - ".github/workflows/blob-layout-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  rust-blob-layout:
    name: rust blob layout + S3 key + interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run file-store unit tests (layout, migration, GC)
        run: "cargo test -p nodalmerge-server --lib store::"

      - name: Run blob GC integration tests
        run: cargo test -p nodalmerge-server --test blob_gc

      - name: Run blob layout vectors
        run: cargo test -p nodalmerge-server --test blob_layout_vectors

      - name: Run cross-runtime golden fixture interop test
        run: cargo test -p nodalmerge-server --test blob_layout_interop

      - name: Run non-hydrating-backend relay contract (S4.2)
        run: cargo test -p nodalmerge-server --test blob_relay_nonhydrating_backend

      - name: Run non-hydrating-backend conformance harness (slice 0.2 harness, fully ungated as of slice 2.3 — GC-live-set/tree-walk went green in 2.2, archive describe/export digest parity + fail-loud in 2.3)
        run: cargo test -p nodalmerge-server --test blob_nonhydrating_conformance

      - name: Run tree-walk depth-bound regression test (slice 1.5, finding #9 — deep chain must fail closed, not abort the process)
        run: cargo test -p nodalmerge-server --test tree_walk_depth

      - name: Run cross-runtime zstd interop test (dotnet-produced frame)
        run: cargo test -p nodalmerge-server --test zstd_interop

      - name: Run blob HTTP surface vectors (GET/HEAD/PUT /blobs/{hash})
        run: cargo test -p nodalmerge-server --test blob_http_surface

      - name: Run blob HTTP off-worker scheduling gate (slice 6.2 — blocking store work (I/O, BLAKE3, zstd, the 6.1 S3 bridge) must run on the blocking pool, never park the async workers; a panic in the offloaded op must map to a logged 500, not a hang or silent success)
        run: cargo test -p nodalmerge-server --test blob_http_offload

      - name: Run PUT durability-truthfulness gate (slice 4.2, finding #8 — a failed persist_blob must answer 5xx and leave no Active inventory row, never a 201 with nothing durably stored; Docker-free, the stalled bucket is an in-test TcpListener)
        run: cargo test -p nodalmerge-server --test blob_put_durability

      - name: Run S3 key layout vectors + Delegate-mode hydrate/tree-walk unit gates (slice 2.2, finding #10)
        run: cargo test -p nodalmerge-s3-blobs --lib

      - name: Run Delegate-mode studio-GC fail-loud gate (slice 2.2, finding #10 — an S3-Delegate server must report "cannot resolve tree object" as a distinct, actionable config error, never a generic missing-blob; no Docker needed, Delegate mode opens no connection)
        run: cargo test -p nodalmerge-s3-blobs --test delegate_gc

      - name: Run stalled-endpoint bridge/timeout gate (slice 6.1, finding #11 — every S3/delegate op against a hung endpoint must fail within the configured bound and classify as a backend error, never as missing/absent; no Docker needed, the stalled endpoint is an in-test TcpListener)
        run: cargo test -p nodalmerge-s3-blobs --test bridge_timeouts

  dotnet-blob-layout:
    name: dotnet blob layout + delegate protocol + interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run blob layout + delegate protocol vectors
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobLayoutParityTests"

      - name: Run cross-runtime golden fixture interop test
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobLayoutInteropTests"

      - name: Run blob HTTP surface vectors (GET/HEAD/PUT /blobs/{hash})
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobHttpSurfaceTests"

      - name: Run file GC coordinator tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobGcCoordinatorTests"

      - name: Run file store migration tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobStoreProviderMigrationTests"

      - name: "Run cross-runtime zstd interop test (dotnet-as-consumer: decodes a rust-produced header-less frame; slice 3.1, finding #4)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ZstdInteropTests"

      - name: "Run non-hydrating-backend conformance harness, .NET half (slice 2.1 — HEAD/PUT-idempotency must route through ExistsAsync, never a full TryGetBlobAsync read)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~NonHydratingBlobBackendConformanceTests"

      - name: "Run IBlobStoreProvider.ExistsAsync additive-compat pin (slice 2.1 — a two-member-only provider must still compile and answer correctly via the default)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobStoreProviderExistsAsyncDefaultTests"

      - name: "Run FileBlobStoreProvider.ExistsAsync cheap-probe tests (slice 2.1)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobStoreProviderExistsAsyncTests"

      - name: "Run FileBlobStoreProvider identity-path BLAKE3 verify-on-read tests (slice 3.2, finding #13 — a tampered identity blob must read as Missing, never wrong bytes)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~FileBlobIdentityVerifyTests"

      - name: "Run blob HTTP encoding negotiation tests (HEAD no longer sets Content-Length — slice 2.1 parity fix)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobHttpEncodingNegotiationTests"

      - name: "Run HttpRemoteBlobStoreProvider tests (ExistsAsync now doubles as IBlobStoreProvider's cheap probe — slice 2.1)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~HttpRemoteBlobStoreProviderTests"

      - name: "Run S3DirectBlobStoreProvider tests, including its new ExistsAsync bucket-HEAD probe (slice 2.1)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~S3DirectBlobStoreProviderTests"

      - name: "Run S3DirectBlobOriginOptions tests (slice 3.3, finding #6 — pins Compression default at Off; client-side zstd is explicit opt-in)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~S3DirectBlobOriginOptionsTests"

      - name: "Run ChainedBlobStoreProvider tests, including its new ExistsAsync composition (local-then-remote cheap probe — slice 2.1)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ChainedBlobStoreProviderTests"

      - name: "Run RemoteBlobLinkAggregator tests, including its ExistsAsync ordered-fallback probe (the chain sees this, not the individual links, once >1 remote link is configured — slice 2.1)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~RemoteBlobLinkAggregatorTests"

      - name: "Run legacy /sync/blob-url golden tests (slice 4.1, finding #12 — restored to main's pre-existing behavior: unix-seconds expiresAt, 404 not 501 for no backend, loose/anonymous hash handling)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~LegacySyncBlobUrlCompatTests"

      - name: "Run provider HTTP endpoint tests, including /sync/blob-url under the WsOnly/File compositions (fixed in place by slice 4.1 to match main's restored shape)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ProviderHttpEndpointTests"

      - name: "Run S3-delegated /sync/blob-url integration tests (pulled forward from the Phase 8 backlog by slice 4.1, since this slice's fix is exactly what these exercise)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ProviderS3DelegatedBlobResolverIntegrationTests"

      - name: "Run BlobHttpOptions startup-validation tests (slice 4.3.1 — non-positive MaxBlobBytes rejected at startup, not 500/413 at request time)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobHttpOptionsValidationTests"

      - name: "Run BaseUrl path-prefix resolution tests (slice 4.3.2 — a reverse-proxy path prefix in RemoteBlobOriginOptions.BaseUrl must survive into every HttpRemoteBlobStoreProvider/S3DirectBlobStoreProvider request, both trailing-slash spellings)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~BlobOriginBaseUrlPathPrefixTests"

      - name: "Run S3DelegatedBlobOptions stale-key guard tests (slice 4.3.3 — removed PutPath/GetPath config keys warn loudly, never hard-fail)"
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~S3DelegatedBlobOptionsStaleKeyGuardTests"
