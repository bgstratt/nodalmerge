[package]
name = "activesync-dev-server"
version = "0.1.0"
edition = "2021"

[dependencies]
activesync-server = { path = "../server" }
activesync-mongo-store = { path = "../node-stores/mongo" }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.1"
env_logger = "0.10"
log = "0.4"

[features]
default = []
