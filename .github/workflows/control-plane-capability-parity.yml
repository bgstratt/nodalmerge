name: control-plane-capability-parity

# Replaces the old authz-conformance-nightly workflow, which compared two
# placeholder "oracles" (a Rust runner that echoed each vector's own expected
# result back as "actual", and a .NET step that mapped vector IDs to
# unrelated pre-existing unit tests) and therefore never caught a real
# regression. This asserts each runtime's live control-plane
# capability-gating behavior against one canonical registry:
#   engine/commands/registry.json        (source of truth)
#   engine/commands/src/lib.rs           (typed access + HostCommand
#                                         exhaustiveness guard)
#   server/server/tests/control_plane_capability_parity.rs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs
#
# It also covers CAPCOMP (capability composition / profile-DAG expansion),
# a related but distinct concern, against its own canonical vectors:
#   engine/commands/capcomp-vectors.v1.json      (source of truth)
#   server/capability-profile/                   (shared Rust crate, used by
#                                                 nodalmerge-server and
#                                                 nodalmerge-jwt-bridge)
#   server/capability-profile/tests/capcomp_vectors.rs
#   server/capability-profile/tests/limits_clamp.rs   (hard-ceiling clamp on
#                                                 profile-supplied limits —
#                                                 plans/blob-cas-remediation.md
#                                                 §4.4; runs via the crate-wide
#                                                 cargo test step below)
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapcompParityTests.cs
#   hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapabilityProfileLimitsClampTests.cs
#   docs/CAPCOMP_PARITY_PLAN.md

on:
  push:
    branches: [main]
    paths:
      - "engine/commands/**"
      - "server/server/src/ws_handler.rs"
      - "server/server/tests/control_plane_capability_parity.rs"
      - "server/capability-profile/**"
      - "server/jwt-bridge/src/**"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/Runtime/RuntimeProtocolMapper.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/CapabilityProfileExpander.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapcompParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapabilityProfileLimitsClampTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapabilityProfileExpanderTests.cs"
      - ".github/workflows/control-plane-capability-parity.yml"
  pull_request:
    paths:
      - "engine/commands/**"
      - "server/server/src/ws_handler.rs"
      - "server/server/tests/control_plane_capability_parity.rs"
      - "server/capability-profile/**"
      - "server/jwt-bridge/src/**"
      - "hosts/dotnet/src/NodalMerge.DotNetHost/Runtime/RuntimeProtocolMapper.cs"
      - "hosts/dotnet/src/NodalMerge.Host.Composition/CapabilityProfileExpander.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/ControlPlaneCapabilityParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapcompParityTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapabilityProfileLimitsClampTests.cs"
      - "hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/CapabilityProfileExpanderTests.cs"
      - ".github/workflows/control-plane-capability-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  rust-capability-table:
    name: rust control-plane capability table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run registry self-tests (schema, exhaustiveness mapping)
        run: cargo test -p nodalmerge-command-registry

      - name: Run control-plane capability parity test
        run: cargo test -p nodalmerge-server --test control_plane_capability_parity

      - name: Run CAPCOMP vectors against the shared capability-profile crate
        run: cargo test -p nodalmerge-capability-profile

      - name: Run jwt-bridge's own CAPCOMP wrapper tests
        run: cargo test -p nodalmerge-jwt-bridge --lib

  dotnet-capability-table:
    name: dotnet control-plane capability table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run control-plane capability parity test
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~ControlPlaneCapabilityParityTests"

      - name: Run CAPCOMP vectors against CapabilityProfileExpander
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~CapcompParityTests"

      - name: Run capability-profile limits hard-ceiling clamp tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~CapabilityProfileLimitsClampTests"

      # Gap found while wiring 4.4 (Phase 8 shape): this pre-existing suite
      # guards CapabilityProfileExpander (a paths: trigger of this workflow)
      # but ran in no workflow at all.
      - name: Run CapabilityProfileExpander unit tests
        run: dotnet test hosts/dotnet/tests/NodalMerge.DotNetHost.Tests/NodalMerge.DotNetHost.Tests.csproj --filter "FullyQualifiedName~CapabilityProfileExpanderTests"
