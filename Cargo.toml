[workspace]
members = [
    "core/crdt",
    "compat/rust/nodalmerge-core",
    "core/gc",
    "compat/rust/nodalmerge-gc",
    "engine/host-core",
    "compat/rust/nodalmerge-host-core",
    "server/axum-embed",
    "compat/rust/nodalmerge-host-axum",
    "engine/host-ffi",
    "compat/rust/nodalmerge-host-ffi",
    "server/server",
    "compat/rust/nodalmerge-server",
    "clients/bridge-wasm",
    "server/jwt-bridge",
    "compat/rust/nodalmerge-jwt-bridge",
    "server/s3-blobs",
    "compat/rust/nodalmerge-s3-blobs",
    "server/stores/mongo",
    "compat/rust/nodalmerge-mongo-store",
    "server/dev-server",
    "server/stores/postgres",
    "compat/rust/nodalmerge-postgres-store",
    "server/stores/conformance",
    "compat/rust/nodalmerge-nodestore-conformance",
    "peer/runtime-local",
    "peer/runtime-local-ffi",
    "peer/headless",
    "peer/cli",
]
resolver = "2"

[workspace.dependencies]
aes-gcm = "0.10"
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports"] }
ed25519-dalek = { version = "2", features = ["rand_core", "batch"] }
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

# Bench builds keep full optimization but emit debuginfo so flamegraph/blondie
# can resolve symbols. No effect on `cargo build --release` artifacts.
[profile.bench]
debug = "line-tables-only"
